<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TitoDex Launcher 0.3 方向原型</title>
<style>
@font-face{font-family:Nunito;src:url(../assets/fonts/Nunito-Regular.ttf);font-weight:400}
@font-face{font-family:Nunito;src:url(../assets/fonts/Nunito-Bold.ttf);font-weight:700}
@font-face{font-family:Nunito;src:url(../assets/fonts/Nunito-ExtraBold.ttf);font-weight:800}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;background:#18202b;color:#dfe7ef;display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:28px;min-height:100vh}
body.shot{padding:0;display:block;background:#000}
body.shot .side,body.shot .bezel-label{display:none}
body.shot .bezel{padding:0;border-radius:0;box-shadow:none;background:none}
body.shot .screen{border-radius:0}
body.device{padding:0;display:block;background:#000;overflow:hidden;height:100vh;overscroll-behavior:none;-webkit-touch-callout:none}
body.device .side,body.device .bezel-label{display:none}
body.device .bezel{position:absolute;left:0;top:0;padding:0;border-radius:0;box-shadow:none;background:none;transform-origin:0 0}
body.device .screen{border-radius:0}
.padlog{position:absolute;left:4px;top:4px;z-index:99;font:10px ui-monospace,monospace;color:#f7d977;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:4px;pointer-events:none}
.bezel{padding:20px;border-radius:36px;background:#0d1219;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 2px #222c38}
.bezel-label{text-align:center;font-size:11px;color:#6d7b8b;margin-top:10px;letter-spacing:.5px}

/* ---------- screen ---------- */
.screen{position:relative;overflow:hidden;border-radius:8px;user-select:none;-webkit-user-select:none;touch-action:none;background:#0e141c;color:#2f4361;cursor:default}
.screen button{font:inherit;cursor:pointer}
.stg{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.screen.motion .stg.main{transition:transform .34s cubic-bezier(.2,.8,.2,1),border-radius .3s,box-shadow .3s}
.wp{position:absolute;inset:-2px}
.wp svg{position:absolute;inset:0;width:100%;height:100%}
.wp .sun{position:absolute;border-radius:50%}
.fx-frost .wp{filter:blur(9px) saturate(1.1);transform:scale(1.08)}
.fx-dim{position:absolute;inset:0;background:rgba(11,32,54,.42)}
.fx-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px)}
.photo-tag{position:absolute;right:10px;bottom:34px;font-size:9px;color:rgba(255,255,255,.6);letter-spacing:.5px}
.grid{position:absolute;inset:0}
.st{position:absolute;padding:5px}
.st>.body{height:100%;position:relative}
.status{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 16px;font-size:11px;font-weight:800;color:var(--bgInk);pointer-events:none}
.status svg{width:13px;height:13px}
.bat{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative;padding:1px}
.bat i{display:block;height:100%;width:82%;background:currentColor;border-radius:1px}
.bat::after{content:'';position:absolute;right:-4px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}

/* clock */
.clock{height:100%;display:flex;flex-direction:column;justify-content:center;color:var(--bgInk);padding:0 6px}
.clock .time{font-weight:800;font-size:60px;line-height:.92;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.clock .time em{font-style:normal;color:var(--accentInk)}
.clock .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;font-weight:700}
.clock.sz-s .time{font-size:56px}
.clock.sz-s .meta{margin-top:6px;flex-wrap:nowrap}
.clock.sz-s .wx{min-height:32px;padding:0 9px}
.clock.sz-l .time{font-size:86px;letter-spacing:-3px;line-height:.86}
.clock.sz-l .time span{display:block}
.clock.sz-l .meta{flex-direction:column;align-items:flex-start;gap:5px}
.clock.sz-w{flex-direction:row;align-items:center;justify-content:space-between}
.clock.sz-w .time{font-size:74px}
.clock.sz-w .meta{flex-direction:column;align-items:flex-end;margin-top:0}
.date{white-space:nowrap}
.wx{min-height:34px;display:inline-flex;align-items:center;gap:5px;padding:0 11px;border-radius:17px;font-size:13px;font-weight:800;position:relative;white-space:nowrap}
.wx svg{width:15px;height:15px}

/* trainer */
.trainer{height:100%;position:relative;display:flex;align-items:center;gap:11px;padding:10px 13px}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:22px;position:relative}
.ttx{min-width:0}
.eyebrow{font-size:8.5px;letter-spacing:1.6px;font-weight:800;opacity:.55}
.nm{font-size:22px;font-weight:800;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{font-size:12px;font-weight:700;opacity:.8;margin-top:1px}
.motto{font-size:12px;margin-top:8px;padding-top:7px;border-top:1px dashed rgba(47,67,97,.3);line-height:1.45}
.trainer.sz-s{flex-direction:column;justify-content:center;gap:5px;padding:8px}
.trainer.sz-s .avatar{width:46px;height:46px;font-size:20px}
.trainer.sz-s .eyebrow,.trainer.sz-s .greet{display:none}
.trainer.sz-s .nm{font-size:13px;text-align:center}
.trainer.sz-l{flex-direction:column;align-items:flex-start;justify-content:center;padding:16px}
.trainer.sz-l .head{display:flex;gap:12px;align-items:center}
.trainer.sz-l .avatar{width:62px;height:62px;font-size:28px}
.tape{display:none}

/* titodex */
.tito{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;border-radius:22px}
.key{width:70px;height:70px;border-radius:50%;position:relative;flex:none}
.lens{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffbe0 0 16%,#f7d977 46%,#d9b14a 100%)}
.cap{font-size:12px;font-weight:800;color:var(--bgInk);letter-spacing:.2px}
.tito.sz-m{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px}
.tl b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.tl span{font-size:12px;font-weight:700;opacity:.75}

/* shelf + icons */
.shelf{height:100%;padding:6px 6px;display:flex;align-items:center;position:relative}
.row{display:flex;gap:0;overflow:hidden;width:100%;height:100%;align-items:center;position:relative;z-index:1}
.shelf.sz-c .row{display:grid;grid-template-columns:repeat(var(--shelfCols),1fr);grid-auto-rows:50%;align-items:center}
.ic{flex:0 0 74px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:16px;position:relative}
.sq{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.3px;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sq.tx{border-radius:50%;background:#2f4361!important}
.sq.tx::after{content:'';position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffbe0 0 16%,#f7d977 46%,#d9b14a)}
.lb{font-size:11px;font-weight:700;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink,#2f4361)}
.auto{position:absolute;top:6px;right:9px;font-size:8.5px;font-style:normal;font-weight:800;padding:1px 4px;border-radius:6px;background:rgba(47,67,97,.78);color:#fff7e6}
.ic.all .sq{background:transparent;border:1.6px dashed currentColor;color:var(--ink,#2f4361);box-shadow:none;font-size:18px}
.ic.ins-before::before,.ic.ins-after::after{content:'';position:absolute;top:12px;bottom:18px;width:3px;border-radius:2px;background:#ff8f6a}
.ic.ins-before::before{left:-2px}.ic.ins-after::after{right:-2px}
.ic.lift{opacity:.25}
.shelf.dropzone{outline:2.5px dashed #ff8f6a;outline-offset:3px}

/* handle */
.handle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:30px;width:140px;display:flex;align-items:flex-end;justify-content:center}
.handle .hv{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 16px 6px}
.chev{width:9px;height:9px;border-left:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg) translate(2px,2px)}

/* ---------- theme: 训练家手帐 ---------- */
.stg[data-theme=journal]{--ink:#36475b;--accentInk:#b0745a}
.stg[data-theme=journal] .plate{background:rgba(255,250,240,var(--pa));border:1.25px solid #7c8999;border-radius:16px;box-shadow:0 2px 0 #e4dfd3,0 3px 0 rgba(86,106,119,.17);color:#36475b}
.stg[data-theme=journal] .trainer.plate{transform:rotate(-1.4deg)}
.stg[data-theme=journal] .tape{display:block;position:absolute;top:-9px;left:50%;width:62px;height:18px;margin-left:-31px;background:rgba(216,213,177,.72);transform:rotate(-4deg);border-left:2px dotted rgba(255,255,255,.5);border-right:2px dotted rgba(255,255,255,.5)}
.stg[data-theme=journal] .avatar{background:#f5e7b6;color:#93674f;box-shadow:inset 0 0 0 3px #fffaf0,inset 0 0 0 4.5px #b18168}
.stg[data-theme=journal] .shelf::after{content:'';position:absolute;inset:5px;border:1px dashed rgba(124,137,153,.55);border-radius:11px;pointer-events:none}
.stg[data-theme=journal] .key{background:#2f4361;box-shadow:0 0 0 4px #fffaf0,0 0 0 5.3px #7c8999,0 4px 0 4px rgba(86,106,119,.2)}
.stg[data-theme=journal] .key::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(255,250,240,.55)}
.stg[data-theme=journal] .tito.sz-m{background:rgba(255,250,240,var(--pa));border:1.25px solid #7c8999;border-radius:16px;box-shadow:0 2px 0 #e4dfd3,0 3px 0 rgba(86,106,119,.17);color:#36475b}
.stg[data-theme=journal] .date{border:1.5px dashed currentColor;border-radius:6px;padding:2px 7px;transform:rotate(-2deg);display:inline-block}
.stg[data-theme=journal] .wx{background:#fffaf0;color:#36475b;border:1.25px solid #7c8999;border-radius:5px 17px 17px 5px;padding-left:18px;box-shadow:0 2px 0 rgba(86,106,119,.15)}
.stg[data-theme=journal] .wx::before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;border:1.25px solid #7c8999;background:#d9e2df}
.stg[data-theme=journal] .clock .time{font-weight:700}
.stg[data-theme=journal] .handle .hv{background:rgba(255,250,240,.94);color:#36475b;border:1.25px solid #7c8999;border-bottom:none;border-radius:11px 11px 0 0}
.stg[data-theme=journal] .sq{border-radius:13px}

/* ---------- theme: 固态塑料 ---------- */
.stg[data-theme=plastic]{--ink:#20334a;--accentInk:#b9dfe7}
.stg[data-theme=plastic] .plate{background:linear-gradient(180deg,rgba(255,255,255,calc(var(--pa) * .95)),rgba(210,230,238,calc(var(--pa) * .62)));backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);border:1.1px solid rgba(255,255,255,.78);border-radius:26px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(19,38,61,.10),0 9px 18px -4px rgba(19,38,61,.38),0 2px 3px -1px rgba(19,38,61,.18);color:#20334a}
.stg[data-theme=plastic] .trainer.plate{background:linear-gradient(180deg,rgba(246,242,255,calc(var(--pa) * .95)),rgba(215,205,234,calc(var(--pa) * .7)))}
.stg[data-theme=plastic] .shelf.plate{background:linear-gradient(180deg,rgba(236,250,252,calc(var(--pa) * .9)),rgba(185,223,231,calc(var(--pa) * .55)))}
.stg[data-theme=plastic] .avatar{background:radial-gradient(circle at 35% 30%,#fff,#d7cdea 55%,#a99bc8);color:#4b3f72;box-shadow:inset 0 -3px 4px rgba(75,63,114,.25),0 3px 6px rgba(19,38,61,.25)}
.stg[data-theme=plastic] .shelf .sq{box-shadow:0 0 0 5px rgba(19,38,61,.13),0 0 0 6px rgba(255,255,255,.55),0 5px 9px rgba(19,38,61,.32),inset 0 1.5px 0 rgba(255,255,255,.45)}
.stg[data-theme=plastic] .shelf .ic.all .sq{box-shadow:none}
.stg[data-theme=plastic] .shelf .ic .lb{margin-top:3px}
.stg[data-theme=plastic] .key{background:radial-gradient(circle at 34% 28%,#8aa3c6 0,#3d5779 38%,#243650 78%,#1a283c);box-shadow:0 0 0 5px rgba(255,255,255,.42),0 0 0 6px rgba(255,255,255,.7),0 10px 16px -2px rgba(10,20,34,.55),inset 0 -5px 8px rgba(0,0,0,.35)}
.stg[data-theme=plastic] .key::after{content:'';position:absolute;left:14px;top:9px;width:26px;height:12px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-20deg)}
.stg[data-theme=plastic] .tito.sz-m{background:linear-gradient(180deg,rgba(255,255,255,calc(var(--pa) * .95)),rgba(210,230,238,calc(var(--pa) * .62)));backdrop-filter:blur(14px);border:1.1px solid rgba(255,255,255,.78);border-radius:26px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 9px 18px -4px rgba(19,38,61,.38);color:#20334a}
.stg[data-theme=plastic] .clock .time{text-shadow:0 2px 0 rgba(10,20,34,.25),0 0 18px rgba(185,223,231,.35)}
.stg[data-theme=plastic] .wx{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.25));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);color:var(--bgInk);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 10px -3px rgba(10,20,34,.35)}
.stg[data-theme=plastic] .handle .hv{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.3));backdrop-filter:blur(8px);color:var(--bgInk);border:1px solid rgba(255,255,255,.7);border-radius:15px;margin-bottom:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.stg[data-theme=plastic] .sq{border-radius:16px}

/* ---------- theme: 扁平贴纸 ---------- */
.stg[data-theme=flat]{--ink:#1a1c20;--accentInk:#ff8f6a}
.stg[data-theme=flat] .plate{background:rgba(249,249,255,var(--pa));border-radius:20px;color:#1a1c20}
.stg[data-theme=flat] .trainer.plate{background:rgba(247,217,119,var(--pa))}
.stg[data-theme=flat] .avatar{background:#2f4361;color:#f7d977}
.stg[data-theme=flat] .clock .time{font-size:68px;letter-spacing:-3.5px}
.stg[data-theme=flat] .clock.sz-l .time{font-size:96px}
.stg[data-theme=flat] .clock.sz-w .time{font-size:82px}
.stg[data-theme=flat] .date{background:#2f4361;color:#fff7e6;border-radius:12px;padding:3px 10px}
.stg[data-theme=flat] .wx{background:#afc7da;color:#1a1c20}
.stg[data-theme=flat] .key{background:#ff8f6a}
.stg[data-theme=flat] .key .lens{background:#fff7e6;width:30px;height:30px;margin:-15px 0 0 -15px;box-shadow:0 0 0 7px #2f4361}
.stg[data-theme=flat] .tito.sz-m{background:rgba(255,143,106,var(--pa));color:#1a1c20}
.stg[data-theme=flat] .tito.sz-m .key{background:#fff7e6}
.stg[data-theme=flat] .tito.sz-m .key .lens{background:#ff8f6a}
.stg[data-theme=flat] .handle .hv{background:#2f4361;color:#fff7e6;border-radius:15px;margin-bottom:5px}
.stg[data-theme=flat] .sq{border-radius:50%;box-shadow:none}
.stg[data-theme=flat] .eyebrow{opacity:.7}

/* ---------- keyboard / pad focus (hidden for touch) ---------- */
.kf::after{content:'';position:absolute;inset:-3px;border-radius:18px;pointer-events:none;z-index:6}
.screen[data-theme=journal] .kf::after{box-shadow:0 0 0 3px #f7d977,0 0 0 4.5px #ae9562;background:rgba(247,217,119,.18)}
.screen[data-theme=plastic] .kf::after{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 16px 4px rgba(185,223,231,.95)}
.screen[data-theme=flat] .kf::after{box-shadow:0 0 0 3.5px #1a1c20;inset:-5px}
.tito.kf::after{border-radius:24px}

/* ---------- edit mode ---------- */
.screen.editing[data-theme=journal]{background:#cfd8d5 radial-gradient(rgba(47,67,97,.16) 1px,transparent 1.4px) 0 0/14px 14px}
.screen.editing[data-theme=plastic]{background:linear-gradient(160deg,#1f3047,#2d4560)}
.screen.editing[data-theme=flat]{background:#dfe3ec}
.editing .stg.main{border-radius:18px;box-shadow:0 12px 30px rgba(8,16,28,.35),0 0 0 1px rgba(255,255,255,.4)}
.cell{position:absolute;border-radius:14px;border:1.2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.07)}
.edit-layout .stg.main .st::before{content:'';position:absolute;inset:1px;border:1.6px dashed rgba(47,67,97,.55);border-radius:20px;pointer-events:none;z-index:4}
.edit-layout .stg.main .st.sel::before{border:2.6px solid #ff8f6a}
.edit-layout .stg.main .st{cursor:grab}
.edit-layout.motion[data-theme=journal] .stg.main .st:not(.drag)>.body{animation:wob 1.6s ease-in-out infinite}
.edit-layout.motion[data-theme=journal] .stg.main .st:nth-child(2n)>.body{animation-delay:-.8s}
@keyframes wob{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.edit-layout[data-theme=plastic] .stg.main .st>.body{transform:scale(.97)}
.st.drag{z-index:30;transition:none!important}
.st.drag>.body{transform:scale(1.05) rotate(1.5deg)!important;filter:drop-shadow(0 14px 18px rgba(10,20,34,.35));animation:none!important}
.stg[data-theme=flat] .st.drag>.body{transform:scale(1.05)!important}
.minus{position:absolute;left:-3px;top:-3px;width:28px;height:28px;border-radius:50%;background:#d64545;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1;z-index:8;box-shadow:0 0 0 2.5px #fff}
.minus::after{content:'';position:absolute;inset:-9px}
.pin{position:absolute;left:2px;top:0;padding:2px 7px;border-radius:9px;background:#2f4361;color:#fff7e6;font-size:10px;font-weight:800;z-index:8}
.drop{position:absolute;border-radius:18px;border:2.6px solid #7ec8a8;background:rgba(126,200,168,.2);pointer-events:none;z-index:2}
.drop.bad{border-color:#d64545;background:rgba(214,69,69,.14)}
.hold>.body{outline:3px solid #ff8f6a;outline-offset:2px;border-radius:20px}

.etop{position:absolute;left:8px;right:8px;top:6px;height:34px;display:flex;align-items:center;gap:6px;z-index:30}
.tabs{flex:1;display:flex;justify-content:center;gap:2px;border-radius:12px;padding:3px;background:rgba(255,250,240,.82);height:34px}
.tab{border:none;background:none;padding:0 12px;border-radius:9px;font-size:13px;font-weight:800;color:#2f4361;position:relative}
.tab.on{background:#2f4361;color:#fff7e6}
.btn{height:34px;padding:0 12px;border-radius:11px;border:none;font-size:13px;font-weight:800;background:rgba(255,250,240,.92);color:#2f4361;display:inline-flex;align-items:center;gap:4px;position:relative;white-space:nowrap}
.btn.pri{background:#2f4361;color:#fff7e6}
.btn[disabled]{opacity:.38}
.btn.icon{width:34px;padding:0;justify-content:center;font-size:16px}
.tray{position:absolute;left:0;right:0;bottom:6px;height:46px;display:flex;align-items:center;gap:6px;overflow:hidden;padding:0 8px;z-index:30}
.tray .lbl{font-size:11px;font-weight:800;color:var(--trayInk);white-space:nowrap;padding:0 2px 0 4px}
.screen[data-theme=journal]{--trayInk:#36475b}.screen[data-theme=plastic]{--trayInk:#dfe9f2}.screen[data-theme=flat]{--trayInk:#1a1c20}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;font-size:12.5px;font-weight:800;background:rgba(255,250,240,.94);color:#2f4361;border:1.25px solid rgba(47,67,97,.22);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;position:relative}
.chip.on{background:#2f4361;color:#fff7e6;border-color:#2f4361}
.chip small{font-size:10px;font-weight:700;opacity:.6;margin-left:1px}
.chip.warn{color:#b03c3c}
.chip.add{border-style:dashed}
.sep{flex:none;width:1px;height:20px;background:rgba(127,140,160,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;height:212px;border-radius:20px 20px 0 0;padding:12px 14px 14px;overflow:hidden;z-index:30;background:rgba(255,250,240,.97);color:#2f4361;box-shadow:0 -8px 24px rgba(8,16,28,.18)}
.screen[data-theme=plastic] .panel{background:rgba(236,244,247,.86);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.8)}
.screen[data-theme=flat] .panel{background:#f9f9ff}
.land .panel{left:auto;width:300px;top:46px;height:auto;border-radius:20px 0 0 0}
