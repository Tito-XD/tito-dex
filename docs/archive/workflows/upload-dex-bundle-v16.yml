name: Patch and Publish Dex Bundle v16
# Historical record only. This file is outside .github/workflows on purpose.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified /v5 objects and switch the root manifest last (false = build + verify only)
        required: true
        default: false
        type: boolean
      expected_production_version:
        description: Live bundleVersion that must still be production before v16 publish (15 until v16 goes live)
        required: true
        default: 15
        type: number
      reuse_run_id:
        description: Reuse a preserved v16 diagnostic artifact from this workflow run
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dex-bundle-v16-production
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    # v16 pulls the live v15 archive and merges 52poke wild held-item data for
    # modern games (SwSh/BDSP/LA/SV/Z-A). No PokeAPI, no sprite rebuild.
    timeout-minutes: 120
    steps:
      - name: Check out selected release ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/dex_bundle_requirements.txt

      - name: Production version pre-check
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          mkdir -p dist/rollback
          curl --fail --location --retry 5 --output dist/live-manifest.json https://dex.tito.cafe/bundle-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path("dist/live-manifest.json").read_text(encoding="utf-8"))
          expected = int(os.environ["EXPECTED_VERSION"])
          assert m["bundleVersion"] == expected, (m["bundleVersion"], expected)
          assert m["cdnPrefix"] == "v5", m
          assert m["complete"] is True, m
          print(f"production pre-check ok: bundleVersion={m['bundleVersion']} cdnPrefix={m['cdnPrefix']}")
          PY

      - name: Preserve the current v15 root manifest for rollback
        if: inputs.publish
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          cp dist/live-manifest.json dist/rollback/bundle-manifest-v15.json
          python3 - <<'PY'
          import json, os
          m = json.load(open("dist/rollback/bundle-manifest-v15.json", encoding="utf-8"))
          assert m["bundleVersion"] == int(os.environ["EXPECTED_VERSION"]) and m["cdnPrefix"] == "v5", m
          PY

      - name: Upload rollback manifest backup
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: titodex-root-manifest-v15-rollback
          path: dist/rollback/bundle-manifest-v15.json
          if-no-files-found: error
          retention-days: 30

      - name: Run v16 held-item unit tests
        run: python3 tools/test_patch_dex_bundle_v16_held_items.py

      - name: Restore preserved v16 bundle
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: titodex-dex-v16-diagnostic-${{ inputs.reuse_run_id }}
          path: dist/dex-v16/upload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id }}

      - name: Patch v15 into Dex bundle v16
        if: inputs.reuse_run_id == ''
        run: >-
          python3 tools/patch_dex_bundle_v16_held_items.py
          --output dist/dex-v16

      - name: Verify upload tree
        run: python3 tools/verify_dex_upload_tree.py dist/dex-v16/upload

      - name: Spot-check modern held items
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path("dist/dex-v16/upload/bundle-manifest.json").read_text(encoding="utf-8"))
          assert root["bundleVersion"] == 16 and root["cdnPrefix"] == "v5", root
          assert root.get("heldItemsSource") == "PokeAPI + 52poke (CC BY-NC-SA 3.0)", root
          detail = json.loads(Path("dist/dex-v16/upload/v5/details/25.json").read_text(encoding="utf-8"))
          items = {item["slug"]: item for item in detail["heldItems"]}
          versions = set(items["light-ball"]["rarityByVersion"])
          assert {"sword", "shield", "scarlet", "violet"} <= versions, versions
          items_json = json.loads(Path("dist/dex-v16/upload/v5/items.json").read_text(encoding="utf-8"))
          assert len(items_json) >= 590, len(items_json)
          print(f"ok: pikachu light-ball {len(versions)} versions, items.json {len(items_json)}")
          PY

      - name: Preserve generated bundle when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v16-diagnostic-${{ github.run_id }}
          path: dist/dex-v16/upload
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v16
          path: dist/dex-v16/upload
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Wrangler
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Install Wrangler
        if: inputs.publish
        working-directory: cloudflare/dex-cdn
        run: npm ci

      - name: Upload and verify immutable /v5 objects
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v16/upload
          --cdn-prefix v5 --phase objects

      - name: Atomically switch the root manifest
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v16/upload
          --cdn-prefix v5 --phase manifest

      - name: Verify public v16 cutover
        if: inputs.publish
        run: |
          curl --fail --retry 8 --retry-delay 5 https://dex.tito.cafe/bundle-manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["bundleVersion"] == 16 and m["cdnPrefix"] == "v5" and m.get("heldItemsSource") == "PokeAPI + 52poke (CC BY-NC-SA 3.0)" and m["archiveUrl"].endswith("/bundle-v16.tar.zst"), m'
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/cdn-health?probe=1' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True, h'
          curl --fail --retry 8 --retry-delay 5 -I https://dex.tito.cafe/v5/bundle-v16.tar.zst | head -n 1
