name: Patch and Publish Dex Bundle v15
# Historical record only. This file is outside .github/workflows on purpose.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified /v5 objects and switch the root manifest last (false = build + verify only)
        required: true
        default: false
        type: boolean
      expected_production_version:
        description: Live bundleVersion that must still be production before v15 publish (14 until v15 goes live)
        required: true
        default: 14
        type: number
      reuse_run_id:
        description: Reuse a preserved v15 diagnostic artifact from this workflow run
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dex-bundle-v15-production
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    # v15 pulls the live v14 compact archive and fills missing zh-Hans flavor
    # text from data/l10n/zh/flavor_text_52poke.json. No PokeAPI, no sprite
    # rebuild.
    timeout-minutes: 120
    steps:
      - name: Check out selected release ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/dex_bundle_requirements.txt

      - name: Production version pre-check
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          mkdir -p dist/rollback
          curl --fail --location --retry 5 --output dist/live-manifest.json https://dex.tito.cafe/bundle-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path("dist/live-manifest.json").read_text(encoding="utf-8"))
          expected = int(os.environ["EXPECTED_VERSION"])
          assert m["bundleVersion"] == expected, (m["bundleVersion"], expected)
          assert m["cdnPrefix"] == "v5", m
          assert m["complete"] is True, m
          print(f"production pre-check ok: bundleVersion={m['bundleVersion']} cdnPrefix={m['cdnPrefix']}")
          PY

      - name: Preserve the current v14 root manifest for rollback
        if: inputs.publish
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          cp dist/live-manifest.json dist/rollback/bundle-manifest-v14.json
          python3 - <<'PY'
          import json, os
          m = json.load(open("dist/rollback/bundle-manifest-v14.json", encoding="utf-8"))
          assert m["bundleVersion"] == int(os.environ["EXPECTED_VERSION"]) and m["cdnPrefix"] == "v5", m
          PY

      - name: Upload rollback manifest backup
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: titodex-root-manifest-v14-rollback
          path: dist/rollback/bundle-manifest-v14.json
          if-no-files-found: error
          retention-days: 30

      - name: Run v15 flavor-text unit tests
        run: python3 tools/test_patch_dex_bundle_v15_flavor_text.py

      - name: Restore preserved v15 bundle
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: titodex-dex-v15-diagnostic-${{ inputs.reuse_run_id }}
          path: dist/dex-v15/upload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id }}

      - name: Patch v14 into Dex bundle v15
        if: inputs.reuse_run_id == ''
        run: >-
          python3 tools/patch_dex_bundle_v15_flavor_text.py
          --flavor-json data/l10n/zh/flavor_text_52poke.json
          --output dist/dex-v15

      - name: Verify upload tree
        run: python3 tools/verify_dex_upload_tree.py dist/dex-v15/upload

      - name: Spot-check zh flavor coverage
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          cjk = re.compile(r'[\u4e00-\u9fff]')
          root = json.loads(Path("dist/dex-v15/upload/bundle-manifest.json").read_text(encoding="utf-8"))
          assert root["bundleVersion"] == 15 and root["cdnPrefix"] == "v5", root
          assert root.get("flavorTextSource") == "PokeAPI + 52poke (CC BY-NC-SA 4.0)", root
          for sid in (1, 152, 906):
              detail = json.loads(Path(f"dist/dex-v15/upload/v5/details/{sid}.json").read_text(encoding="utf-8"))
              assert any(cjk.search(e.get("text", "")) for e in detail.get("flavorEntries") or []), sid
          print("ok: zh flavor present for sample species 1/152/906")
          PY

      - name: Preserve generated bundle when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v15-diagnostic-${{ github.run_id }}
          path: dist/dex-v15/upload
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v15
          path: dist/dex-v15/upload
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Wrangler
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Install Wrangler
        if: inputs.publish
        working-directory: cloudflare/dex-cdn
        run: npm ci

      - name: Upload and verify immutable /v5 objects
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v15/upload
          --cdn-prefix v5 --phase objects

      - name: Atomically switch the root manifest
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v15/upload
          --cdn-prefix v5 --phase manifest

      - name: Verify public v15 cutover
        if: inputs.publish
        run: |
          curl --fail --retry 8 --retry-delay 5 https://dex.tito.cafe/bundle-manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["bundleVersion"] == 15 and m["cdnPrefix"] == "v5" and m.get("flavorTextSource") == "PokeAPI + 52poke (CC BY-NC-SA 4.0)" and m["archiveUrl"].endswith("/bundle-v15.tar.zst"), m'
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/cdn-health?probe=1' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True, h'
          curl --fail --retry 8 --retry-delay 5 -I https://dex.tito.cafe/v5/bundle-v15.tar.zst | head -n 1
