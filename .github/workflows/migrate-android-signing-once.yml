name: One-time Android signing verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == 'Tito-XD'
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 5
    steps:
      # No checkout or build code. Verify the migrated key with JDK tools only.
      - name: Verify migrated private key and certificate identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/migration-check.keystore"
          cert="$RUNNER_TEMP/migration-check.der"
          csr="$RUNNER_TEMP/migration-check.csr"
          trap 'rm -f "$key" "$cert" "$csr"' EXIT
          [[ "$ANDROID_SIGNER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          unset ANDROID_KEYSTORE_BASE64
          keytool -exportcert -keystore "$key" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD -file "$cert"
          actual="$(sha256sum "$cert" | cut -d ' ' -f 1)"
          test "$actual" = "${ANDROID_SIGNER_SHA256,,}"
          keytool -certreq -keystore "$key" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -file "$csr"
          test -s "$csr"
          printf 'Migrated private key and certificate pin verified.\n'
