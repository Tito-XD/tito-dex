name: Android release security regression

on:
  push:
    paths:
      - .github/workflows/android-release*.yml
      - .github/workflows/publish-android-release.yml
      - tools/test_android_release_security.py
  pull_request:
    paths:
      - .github/workflows/android-release*.yml
      - .github/workflows/publish-android-release.yml
      - tools/test_android_release_security.py

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest tools.test_android_release_security -v
