name: Commit attribution

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    name: Commit authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test attribution policy
        run: python3 -m unittest discover -s tools -p test_commit_attribution.py
      - name: Check branch history
        run: python3 tools/check_commit_attribution.py --rev HEAD
