name: Verify and optionally publish Dex Bundle v20

on:
  workflow_dispatch:
    inputs:
      approved_v19_root_manifest_sha256:
        description: SHA-256 of the locally approved, exact production v19 root manifest
        required: true
        type: string
      upload_objects:
        description: Upload and read back the prepared v5 object set (false = dry-run only)
        required: true
        default: false
        type: boolean
      publish_manifest:
        description: Switch the root manifest after the verified object receipt exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dex-bundle-v20-production
  cancel-in-progress: false

jobs:
  prepare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Download only hash-locked Python wheels
        run: >-
          python -m pip download --require-hashes --only-binary=:all: -r tools/dex_bundle_requirements.lock -d dist/release-runtime/wheels
      - name: Prepare repository-locked Wrangler without install scripts
        working-directory: cloudflare/dex-cdn
        run: |
          npm ci --ignore-scripts
          tar -czf ../../dist/release-runtime/wrangler-runtime.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dex-release-runtime
          path: dist/release-runtime
          if-no-files-found: error
          retention-days: 14

  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TITODEX_DEX_CDN_BASE: ${{ secrets.TITODEX_DEX_CDN_BASE }}
      V20_GENERATED_AT: "2026-08-23T11:09:04+00:00"
      V20_EXPECTED_ARCHIVE_SHA256: "e7c8e059ed9ee0a8d5e77a9a8ac0a13516f66c848597276f989d5800051530d5"
      V20_EXPECTED_ROOT_MANIFEST_SHA256: "cbefb7e1e6851e5fe1038e175be60ee310057f825d73f863899211f8be1878b1"
    steps:
      - name: Reject an incomplete phase combination
        env:
          APPROVED_ROOT_SHA: ${{ inputs.approved_v19_root_manifest_sha256 }}
          UPLOAD_OBJECTS: ${{ inputs.upload_objects }}
          PUBLISH_MANIFEST: ${{ inputs.publish_manifest }}
        run: |
          set -euo pipefail
          test -n "$TITODEX_DEX_CDN_BASE"
          test "${#APPROVED_ROOT_SHA}" -eq 64
          if [ "$PUBLISH_MANIFEST" = "true" ] && [ "$UPLOAD_OBJECTS" != "true" ]; then
            echo "publish_manifest requires upload_objects in the same protected run" >&2
            exit 1
          fi

      - name: Check out selected release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.lock

      - name: Install data-build dependencies
        run: >-
          pip install --require-hashes --only-binary=:all: -r tools/dex_bundle_requirements.lock

      - name: Run v20 release-gate unit tests
        run: |
          python3 tools/test_dex_v20_release_gate.py
          python3 tools/test_upload_dex_v20_release.py

      - name: Fetch the exact approved v19 base and preserve rollback material
        env:
          APPROVED_ROOT_SHA: ${{ inputs.approved_v19_root_manifest_sha256 }}
        run: >-
          python3 tools/dex_v20_release_gate.py fetch-base
          --output dist/dex-v19-approved-base
          --approved-root-sha256 "$APPROVED_ROOT_SHA"


      - name: Build the pinned reference and gameplay overlay
        run: >-
          python3 tools/build_dex_v20_reference_overlay.py
          --base-staging dist/dex-v19-approved-base/staging
          --base-root-manifest dist/dex-v19-approved-base/base-root-manifest.json
          --output dist/dex-v20-reference-overlay
          --generated-at "$V20_GENERATED_AT"

      - name: Build the complete v20 candidate
        run: >-
          python3 tools/build_dex_v20_candidate.py
          --base-staging dist/dex-v19-approved-base/staging
          --base-root-manifest dist/dex-v19-approved-base/base-root-manifest.json
          --overlay dist/dex-v20-reference-overlay
          --output dist/dex-v20-candidate
          --generated-at "$V20_GENERATED_AT"

      - name: Run the three mandatory candidate verifiers and prepare an isolated release
        run: >-
          python3 tools/dex_v20_release_gate.py prepare
          --candidate dist/dex-v20-candidate
          --base-root-manifest dist/dex-v19-approved-base/base-root-manifest.json
          --base-archive dist/dex-v19-approved-base/base-v19.tar.zst
          --base-staging dist/dex-v19-approved-base/staging
          --output dist/dex-v20-release
          --published-at "$V20_GENERATED_AT"
          --expected-archive-sha256 "$V20_EXPECTED_ARCHIVE_SHA256"
          --expected-root-manifest-sha256 "$V20_EXPECTED_ROOT_MANIFEST_SHA256"

      - name: Prove publication is dry-run and legacy rollback is disabled
        run: |
          python3 tools/upload_dex_v20_release.py dist/dex-v20-release --phase objects
          python3 tools/upload_dex_v20_release.py dist/dex-v20-release --phase manifest
          if python3 tools/upload_dex_v20_release.py dist/dex-v20-release --phase rollback > rollback-rejection.log 2>&1; then
            echo "Legacy rollback unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "v19 rollback is disabled" rollback-rejection.log

      - name: Store verified v20 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titodex-dex-v20-release-candidate
          path: dist/dex-v20-release
          if-no-files-found: error
          retention-days: 14

      - name: Store the exact v19 rollback manifest separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titodex-root-manifest-v19-rollback
          path: dist/dex-v20-release/rollback/bundle-manifest-v19.json
          if-no-files-found: error
          retention-days: 90

  upload-v5-objects:
    if: inputs.upload_objects
    needs: [build-and-verify, prepare-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: dex-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: titodex-dex-v20-release-candidate
          path: dist/dex-v20-release

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.lock

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dex-release-runtime
          path: dist/release-runtime
      - name: Install verified Python wheels without network access
        run: >-
          python -m pip install --no-index --find-links dist/release-runtime/wheels --require-hashes --only-binary=:all: -r tools/dex_bundle_requirements.lock
      - name: Restore prepared Wrangler without running npm
        run: tar -xzf dist/release-runtime/wrangler-runtime.tar.gz -C cloudflare/dex-cdn

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Resume v5 objects within Cloudflare API limits
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_v20_release.py dist/dex-v20-release
          --phase objects --execute
          --workers 8
          --readback-sample 64
          --receipt dist/dex-v20-upload-receipt.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titodex-dex-v20-object-receipt
          path: dist/dex-v20-upload-receipt.json
          if-no-files-found: error
          retention-days: 90

  publish-root-manifest:
    if: inputs.publish_manifest && inputs.upload_objects
    needs:
      - prepare-runtime
      - build-and-verify
      - upload-v5-objects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dex-production
    env:
      TITODEX_DEX_CDN_BASE: ${{ secrets.TITODEX_DEX_CDN_BASE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: titodex-dex-v20-release-candidate
          path: dist/dex-v20-release

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: titodex-dex-v20-object-receipt
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.lock

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dex-release-runtime
          path: dist/release-runtime
      - name: Install verified Python wheels without network access
        run: >-
          python -m pip install --no-index --find-links dist/release-runtime/wheels --require-hashes --only-binary=:all: -r tools/dex_bundle_requirements.lock
      - name: Restore prepared Wrangler without running npm
        run: tar -xzf dist/release-runtime/wrangler-runtime.tar.gz -C cloudflare/dex-cdn

      - name: Reconfirm exact v19 production root immediately before cutover
        env:
          APPROVED_ROOT_SHA: ${{ inputs.approved_v19_root_manifest_sha256 }}
        run: >-
          python3 tools/dex_v20_release_gate.py assert-live-base
          --approved-manifest dist/dex-v20-release/rollback/bundle-manifest-v19.json
          --approved-sha256 "$APPROVED_ROOT_SHA"

      - name: Switch only the root manifest after the verified object receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_v20_release.py dist/dex-v20-release
          --phase manifest --execute --publish-manifest
          --receipt dist/dex-v20-upload-receipt.json

      - name: Verify the exact approved v20 root is publicly active
        run: >-
          python3 tools/dex_v20_release_gate.py wait-live-target
          --target-manifest dist/dex-v20-release/manifest/bundle-manifest.json
          --timeout 600 --interval 10
