name: Publish Verified Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the leading v
        required: true
        type: string
      source_sha:
        description: Exact verified main commit to tag
        required: true
        type: string
      build_run_id:
        description: Successful Android Release APKs workflow run
        required: true
        type: string
      lite_build_number:
        description: Expected Lite Android versionCode
        required: true
        type: string
      offline_build_number:
        description: Expected Offline Android versionCode
        required: true
        type: string
      release_title:
        description: Full Chinese release title, for example TitoDex v0.8.8 · 存档助手与地点图鉴
        required: true
        type: string
      release_summary:
        description: One-sentence Chinese user-facing summary
        required: true
        type: string
      release_highlights:
        description: Chinese Markdown bullet list of user-visible changes
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  verify-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Java for apksigner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify build run belongs to this source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(printf '%s' "$run_json" | jq -r .name)" = "Android Release APKs"
          test "$(printf '%s' "$run_json" | jq -r .event)" = "workflow_dispatch"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = "success"
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$SOURCE_SHA"

      - name: Download verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TitoDex-${{ inputs.version }}-*-rg-arm64.apk
          path: dist/release
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Reverify APK contents and signatures
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          lite="dist/release/TitoDex-$VERSION-lite-rg-arm64.apk"
          offline="dist/release/TitoDex-$VERSION-offline-rg-arm64.apk"
          tools/verify_release_apk.sh \
            --expected-package com.tito.titodex \
            --expected-version-name "$VERSION" \
            --expected-version-code "$LITE_BUILD_NUMBER" \
            "$lite"
          tools/verify_release_apk.sh --offline \
            --expected-package com.tito.titodex \
            --expected-version-name "$VERSION-offline" \
            --expected-version-code "$OFFLINE_BUILD_NUMBER" \
            "$offline"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          lite_certs="$($apksigner verify --verbose --print-certs "$lite")"
          offline_certs="$($apksigner verify --verbose --print-certs "$offline")"
          printf '%s\n' "$lite_certs"
          printf '%s\n' "$offline_certs"
          # apksigner labels the same certificate as either "Signer #1" or
          # "V2 Signer" depending on the installed Android build-tools version.
          lite_signer="$(printf '%s\n' "$lite_certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          offline_signer="$(printf '%s\n' "$offline_certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$lite_signer"
          test "$lite_signer" = "$offline_signer"
          if [[ -n "$EXPECTED_SIGNER_SHA256" ]]; then
            test "${lite_signer,,}" = "${EXPECTED_SIGNER_SHA256,,}"
          fi
          sha256sum "$lite" "$offline" | tee dist/release/SHA256SUMS.txt

      - name: Create annotated tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          RELEASE_HIGHLIGHTS: ${{ inputs.release_highlights }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_tags="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -n "$remote_tags" ]]; then
            remote_target="$(printf '%s\n' "$remote_tags" | awk '$2 ~ /\^\{\}$/ {print $1}')"
            test -n "$remote_target"
            test "$remote_target" = "$SOURCE_SHA"
          else
            git tag -a "$tag" "$SOURCE_SHA" -m "TitoDex $tag"
            git push origin "refs/tags/$tag"
          fi
          printf '%s\n\n' "$RELEASE_SUMMARY" > /tmp/release-notes.md
          printf '### 本次更新\n\n%s\n\n' "$RELEASE_HIGHLIGHTS" >> /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<EOF
          ### 下载

          - \`TitoDex-$VERSION-lite-rg-arm64.apk\`：推荐版本，按需下载离线数据包。
          - \`TitoDex-$VERSION-offline-rg-arm64.apk\`：内置已验证的紧凑离线数据。

          ### 验证

          两个 APK 均为 arm64-v8a，且已核对应用版本、版本码、包名、压缩包完整性与发布签名；Offline 版本额外验证内置数据清单和归档摘要。
          EOF
          {
            printf '\n### SHA-256\n\n```text\n'
            cat dist/release/SHA256SUMS.txt
            printf '```\n'
          } >> /tmp/release-notes.md
          gh release create "$tag" \
            "dist/release/TitoDex-$VERSION-lite-rg-arm64.apk" \
            "dist/release/TitoDex-$VERSION-offline-rg-arm64.apk" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md
