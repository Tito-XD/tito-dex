name: Publish Verified Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the leading v
        required: true
        type: string
      source_sha:
        description: Exact verified main commit to tag
        required: true
        type: string
      build_run_id:
        description: Successful Android Release APKs workflow run
        required: true
        type: string
      lite_build_number:
        description: Expected Lite Android versionCode
        required: true
        type: string
      offline_build_number:
        description: Expected Offline Android versionCode
        required: true
        type: string
      extension_version:
        description: Expected Journey Assistant extension versionName
        required: true
        type: string
      extension_build_number:
        description: Expected Journey Assistant extension versionCode
        required: true
        type: string
      release_title:
        description: Full Chinese release title, for example TitoDex v0.8.8 · 存档助手与地点图鉴
        required: true
        type: string
      release_summary:
        description: One-sentence Chinese user-facing summary
        required: true
        type: string
      release_highlights:
        description: Chinese Markdown bullet list of user-visible changes
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  approve-source:
    name: Verify protected main source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Verify source approval before building or signing
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              throw new Error('Release workflows must be dispatched on main');
            }
            const branch = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data;
            if (!branch.protected || ! /^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA)) {
              throw new Error('Source must be a full SHA and main must be protected');
            }
            const comparison = (await github.rest.repos.compareCommits({
              ...repo, base: process.env.SOURCE_SHA, head: branch.commit.sha
            })).data;
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Source is not reachable from protected main');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'commit-attribution.yml', head_sha: process.env.SOURCE_SHA,
              status: 'success', per_page: 100
            })).data.workflow_runs;
            if (!runs.some(run => run.head_sha === process.env.SOURCE_SHA && run.event === 'push' &&
                run.head_repository.full_name === `${repo.owner}/${repo.repo}`)) {
              throw new Error('Exact source has no successful push Commit attribution run');
            }
            // Fail closed: merely naming an environment would auto-create an unprotected one.
            const environment = (await github.rest.repos.getEnvironment({
              ...repo, environment_name: 'android-release'
            })).data;
            const reviewers = environment.protection_rules.find(rule => rule.type === 'required_reviewers');
            if (!reviewers || !reviewers.prevent_self_review || !reviewers.reviewers?.length ||
                environment.can_admins_bypass !== false ||
                !environment.deployment_branch_policy?.custom_branch_policies) {
              throw new Error('android-release must require independent review, forbid bypass, and restrict branches');
            }
            const policies = await github.paginate(github.rest.repos.listDeploymentBranchPolicies, {
              ...repo, environment_name: 'android-release', per_page: 100
            });
            if (policies.length !== 1 || policies[0].name !== 'main' || policies[0].type !== 'branch') {
              throw new Error('android-release must allow only the main branch (no tags)');
            }
            core.setOutput('source_sha', process.env.SOURCE_SHA);

  verify-and-draft:
    needs: approve-source
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.approve-source.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java for apksigner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify build run belongs to this source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          expected_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-release-build.yml" --jq .id)"
          test "$(printf '%s' "$run_json" | jq -r .workflow_id)" = "$expected_workflow_id"
          test "$(printf '%s' "$run_json" | jq -r .path)" = ".github/workflows/android-release-build.yml"
          test "$(printf '%s' "$run_json" | jq -r .head_branch)" = "main"
          test "$(printf '%s' "$run_json" | jq -r .head_repository.full_name)" = "$GITHUB_REPOSITORY"
          test "$(printf '%s' "$run_json" | jq -r .event)" = "workflow_dispatch"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = "success"
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$SOURCE_SHA"

      - name: Download verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TitoDex-*
          path: dist/release
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Reverify APK contents and signatures
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          lite="dist/release/TitoDex-$VERSION-lite-rg-arm64.apk"
          offline="dist/release/TitoDex-$VERSION-offline-rg-arm64.apk"
          extension="dist/release/TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"
          tools/verify_release_apk.sh \
            --expected-package com.tito.titodex \
            --expected-version-name "$VERSION" \
            --expected-version-code "$LITE_BUILD_NUMBER" \
            "$lite"
          tools/verify_release_apk.sh --offline \
            --expected-package com.tito.titodex \
            --expected-bundle-version 20 \
            --expected-version-name "$VERSION-offline" \
            --expected-version-code "$OFFLINE_BUILD_NUMBER" \
            "$offline"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"
          extension_badging="$($aapt dump badging "$extension" | head -n 1)"
          [[ "$extension_badging" == *"name='com.tito.titodex.extension.journeyassistant'"* ]]
          [[ "$extension_badging" == *"versionCode='$EXTENSION_BUILD_NUMBER'"* ]]
          [[ "$extension_badging" == *"versionName='$EXTENSION_VERSION'"* ]]
          lite_certs="$($apksigner verify --verbose --print-certs "$lite")"
          offline_certs="$($apksigner verify --verbose --print-certs "$offline")"
          extension_certs="$($apksigner verify --verbose --print-certs "$extension")"
          printf '%s\n' "$lite_certs"
          printf '%s\n' "$offline_certs"
          printf '%s\n' "$extension_certs"
          # apksigner labels the same certificate as either "Signer #1" or
          # "V2 Signer" depending on the installed Android build-tools version.
          lite_signer="$(printf '%s\n' "$lite_certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          offline_signer="$(printf '%s\n' "$offline_certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          extension_signer="$(printf '%s\n' "$extension_certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$lite_signer"
          test "$lite_signer" = "$offline_signer"
          test "$lite_signer" = "$extension_signer"
          [[ "$EXPECTED_SIGNER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]
          test "${lite_signer,,}" = "${EXPECTED_SIGNER_SHA256,,}"
          (
            cd dist/release
            sha256sum \
              "TitoDex-$VERSION-lite-rg-arm64.apk" \
              "TitoDex-$VERSION-offline-rg-arm64.apk"
          ) | tee dist/release/SHA256SUMS.txt

      - name: Create annotated tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          RELEASE_HIGHLIGHTS: ${{ inputs.release_highlights }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_tags="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -n "$remote_tags" ]]; then
            remote_target="$(printf '%s\n' "$remote_tags" | awk '$2 ~ /\^\{\}$/ {print $1}')"
            test -n "$remote_target"
            test "$remote_target" = "$SOURCE_SHA"
          else
            git tag -a "$tag" "$SOURCE_SHA" -m "TitoDex $tag"
            git push origin "refs/tags/$tag"
          fi
          printf '%s\n\n' "$RELEASE_SUMMARY" > /tmp/release-notes.md
          printf '### 本次更新\n\n%s\n\n' "$RELEASE_HIGHLIGHTS" >> /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<EOF
          ### 下载

          - \`TitoDex-$VERSION-lite-rg-arm64.apk\`：推荐版本，按需下载离线数据包；versionCode \`$LITE_BUILD_NUMBER\`。
          - \`TitoDex-$VERSION-offline-rg-arm64.apk\`：内置完整校验的 v20 离线资料；versionCode \`$OFFLINE_BUILD_NUMBER\`。

          Journey Assistant 已内建于主 App，不需要另装附加 APK。旧 1.0.0 包只保留读取兼容。

          ### 验证

          主应用两个 APK 均为 arm64-v8a，已核对版本、版本码、包名、压缩包完整性与同一发布签名；Offline 版本额外验证内置数据清单和归档摘要。CI 额外交叉核对历史内容包的发布签名，但不把它作为用户下载项发布。
          EOF
          {
            printf '\n### SHA-256\n\n```text\n'
            cat dist/release/SHA256SUMS.txt
            printf '```\n'
          } >> /tmp/release-notes.md
          gh release create "$tag" \
            "dist/release/TitoDex-$VERSION-lite-rg-arm64.apk" \
            "dist/release/TitoDex-$VERSION-offline-rg-arm64.apk" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md
