name: Publish Verified Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the leading v
        required: true
        type: string
      source_sha:
        description: Exact verified main commit to tag
        required: true
        type: string
      build_run_id:
        description: Successful Android Release APKs workflow run
        required: true
        type: string
      lite_build_number:
        description: Expected Lite Android versionCode
        required: true
        type: string
      offline_build_number:
        description: Expected Offline Android versionCode
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  verify-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Java for apksigner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify build run belongs to this source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(printf '%s' "$run_json" | jq -r .name)" = "Android Release APKs"
          test "$(printf '%s' "$run_json" | jq -r .event)" = "workflow_dispatch"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = "success"
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$SOURCE_SHA"

      - name: Download verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TitoDex-${{ inputs.version }}-*-rg-arm64.apk
          path: dist/release
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Reverify APK contents and signatures
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          lite="dist/release/TitoDex-$VERSION-lite-rg-arm64.apk"
          offline="dist/release/TitoDex-$VERSION-offline-rg-arm64.apk"
          tools/verify_release_apk.sh \
            --expected-package com.tito.titodex \
            --expected-version-name "$VERSION" \
            --expected-version-code "$LITE_BUILD_NUMBER" \
            "$lite"
          tools/verify_release_apk.sh --offline \
            --expected-package com.tito.titodex \
            --expected-version-name "$VERSION-offline" \
            --expected-version-code "$OFFLINE_BUILD_NUMBER" \
            "$offline"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          lite_certs="$($apksigner verify --verbose --print-certs "$lite")"
          offline_certs="$($apksigner verify --verbose --print-certs "$offline")"
          printf '%s\n' "$lite_certs"
          printf '%s\n' "$offline_certs"
          lite_signer="$(printf '%s\n' "$lite_certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          offline_signer="$(printf '%s\n' "$offline_certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$lite_signer"
          test "$lite_signer" = "$offline_signer"
          if [[ -n "$EXPECTED_SIGNER_SHA256" ]]; then
            test "${lite_signer,,}" = "${EXPECTED_SIGNER_SHA256,,}"
          fi
          sha256sum "$lite" "$offline" | tee dist/release/SHA256SUMS.txt

      - name: Create annotated tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SOURCE_SHA" -m "TitoDex $tag"
          git push origin "refs/tags/$tag"
          cat > /tmp/release-notes.md <<EOF
          TitoDex $tag ships verified Lite and Offline Android packages.

          ### Downloads

          - \`TitoDex-$VERSION-lite-rg-arm64.apk\`: recommended; downloads the offline data pack on demand.
          - \`TitoDex-$VERSION-offline-rg-arm64.apk\`: embeds the verified compact offline seed.

          Both APKs contain the arm64-v8a Flutter runtime and are verified against the requested app version, build number, package id, archive integrity, and release signer.
          EOF
          {
            printf '\n### SHA-256\n\n```text\n'
            cat dist/release/SHA256SUMS.txt
            printf '```\n'
          } >> /tmp/release-notes.md
          gh release create "$tag" \
            "dist/release/TitoDex-$VERSION-lite-rg-arm64.apk" \
            "dist/release/TitoDex-$VERSION-offline-rg-arm64.apk" \
            --verify-tag \
            --draft \
            --title "TitoDex $tag" \
            --notes-file /tmp/release-notes.md
