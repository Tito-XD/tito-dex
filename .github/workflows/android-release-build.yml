name: Android Release APKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the leading v, for example 0.5.5
        required: true
        type: string
      lite_build_number:
        description: Monotonically increasing Android versionCode for Lite
        required: true
        type: string
      offline_build_number:
        description: Monotonically increasing Android versionCode for Offline
        required: true
        type: string
      extension_version:
        description: Journey Assistant extension versionName
        required: true
        default: 1.0.0
        type: string
      extension_build_number:
        description: Journey Assistant extension versionCode
        required: true
        default: "1"
        type: string
      bundle_manifest_url:
        description: Published root manifest used to seed the Offline APK
        required: true
        default: https://dex.tito.cafe/bundle-manifest.json
        type: string
      offline_seed_apk_url:
        description: Optional prior Offline APK whose verified embedded dex seed should be reused
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  approve-source:
    name: Verify protected main source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Verify source approval before building or signing
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              throw new Error('Release workflows must be dispatched on main');
            }
            const branch = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data;
            if (!branch.protected || branch.commit.sha !== context.sha) {
              throw new Error('Release source must be the exact protected main tip');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'commit-attribution.yml', head_sha: context.sha,
              status: 'success', per_page: 100
            })).data.workflow_runs;
            if (!runs.some(run => run.head_sha === context.sha && run.event === 'push' &&
                run.head_repository.full_name === `${repo.owner}/${repo.repo}`)) {
              throw new Error('Exact source has no successful push Commit attribution run');
            }
            // Fail closed: merely naming an environment would auto-create an unprotected one.
            const environment = (await github.rest.repos.getEnvironment({
              ...repo, environment_name: 'android-release'
            })).data;
            const reviewers = environment.protection_rules.find(rule => rule.type === 'required_reviewers');
            if (!reviewers || !reviewers.prevent_self_review || !reviewers.reviewers?.length ||
                environment.can_admins_bypass !== false ||
                !environment.deployment_branch_policy?.custom_branch_policies) {
              throw new Error('android-release must require independent review, forbid bypass, and restrict branches');
            }
            const policies = await github.paginate(github.rest.repos.listDeploymentBranchPolicies, {
              ...repo, environment_name: 'android-release', per_page: 100
            });
            if (policies.length !== 1 || policies[0].name !== 'main' || policies[0].type !== 'branch') {
              throw new Error('android-release must allow only the main branch (no tags)');
            }
            core.setOutput('source_sha', context.sha);

  validate:
    needs: approve-source
    name: Analyze and test release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.approve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$LITE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$OFFLINE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXTENSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$EXTENSION_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( OFFLINE_BUILD_NUMBER > LITE_BUILD_NUMBER ))

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Verify companion animation catalog
        run: |
          cd ..
          python3 tools/generate_companion_animation_catalog.py --check
          python3 -m unittest tools.test_audit_hd_companion_sources -v

  build:
    name: Build unsigned ${{ matrix.variant }} APK
    needs: [approve-source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, offline]
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.approve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Require secret-free checkout
        run: |
          test ! -e android/key.properties
          test ! -e android/titodex-upload.keystore

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Download and verify published offline dex seed
        if: matrix.variant == 'offline'
        env:
          BUNDLE_MANIFEST_URL: ${{ inputs.bundle_manifest_url }}
          OFFLINE_SEED_APK_URL: ${{ inputs.offline_seed_apk_url }}
        run: |
          set -euo pipefail
          mkdir -p assets/dex
          if [[ -n "$OFFLINE_SEED_APK_URL" ]]; then
            curl --fail --location --retry 5 --output /tmp/titodex-offline-seed.apk "$OFFLINE_SEED_APK_URL"
            unzip -p /tmp/titodex-offline-seed.apk \
              assets/flutter_assets/assets/dex/bundle-manifest.json \
              > assets/dex/bundle-manifest.json
            unzip -p /tmp/titodex-offline-seed.apk \
              assets/flutter_assets/assets/dex/bundle.tar.zst \
              > assets/dex/bundle.tar.zst
          else
            curl --fail --location --retry 5 --output assets/dex/bundle-manifest.json "$BUNDLE_MANIFEST_URL"
          fi
          archive_url="$(python3 -c 'import json; print(json.load(open("assets/dex/bundle-manifest.json"))["archiveUrl"])')"
          expected_sha="$(python3 -c 'import json; print(json.load(open("assets/dex/bundle-manifest.json"))["archiveSha256"])')"
          python3 - <<'PY'
          import json
          manifest = json.load(open("assets/dex/bundle-manifest.json", encoding="utf-8"))
          assert manifest["bundleVersion"] == 20, manifest
          assert manifest["pokemonCount"] == 1025, manifest
          assert manifest["complete"] is True, manifest
          assert manifest["cdnPrefix"] == "v5", manifest
          assert "/v5/" in manifest["archiveUrl"], manifest
          assert len(manifest["archiveSha256"]) == 64, manifest
          PY
          if [[ -z "$OFFLINE_SEED_APK_URL" ]]; then
            curl --fail --location --retry 5 --output assets/dex/bundle.tar.zst "$archive_url"
          fi
          test -s assets/dex/bundle.tar.zst
          test -s assets/dex/bundle-manifest.json
          actual_sha="$(sha256sum assets/dex/bundle.tar.zst | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          sed -i '\|    - assets/config/|a\    - assets/dex/' pubspec.yaml

      - name: Prepare production dependencies
        run: |
          set -euo pipefail
          # Flutter 3.44.x can generate a production registrant for root dev
          # plugins that Gradle correctly omits from the release classpath.
          # Keep integration_test for validation, but exclude it from the
          # ephemeral release-build dependency graph.
          test "$(grep -c '^  integration_test:$' pubspec.yaml)" -eq 1
          sed -i '/^  integration_test:$/,+1d' pubspec.yaml
          flutter pub get
          ! grep -q '"name":"integration_test"' .flutter-plugins-dependencies

      - name: Configure package version
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == "offline" ]]; then
            echo "BUILD_NAME=$VERSION-offline" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$OFFLINE_BUILD_NUMBER" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$LITE_BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "ARTIFACT_NAME=TitoDex-$VERSION-$VARIANT-rg-arm64.apk" >> "$GITHUB_ENV"

      - name: Build unsigned arm64 APK
        env:
          TITODEX_JOURNEY_ASSISTANT_URL: ${{ secrets.TITODEX_JOURNEY_ASSISTANT_URL }}
          TITODEX_EXTENSION_CATALOG_URL: ${{ secrets.TITODEX_EXTENSION_CATALOG_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          expected = {
              "TITODEX_JOURNEY_ASSISTANT_URL": "/v1/ask",
              "TITODEX_EXTENSION_CATALOG_URL": "/v1/extensions/journey_assistant/catalog",
          }
          origins = set()
          for name, path in expected.items():
              value = os.environ.get(name, "")
              parsed = urlparse(value)
              assert parsed.scheme == "https" and parsed.netloc, f"{name} is not configured"
              assert not parsed.username and not parsed.password
              assert parsed.path == path and not parsed.query and not parsed.fragment
              origins.add((parsed.scheme, parsed.netloc))
          assert len(origins) == 1, "Journey endpoints must share one Worker origin"
          PY
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define="TITODEX_JOURNEY_ASSISTANT_URL=$TITODEX_JOURNEY_ASSISTANT_URL" \
            --dart-define="TITODEX_EXTENSION_CATALOG_URL=$TITODEX_EXTENSION_CATALOG_URL"

      - name: Stage unsigned APK
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/$ARTIFACT_NAME"
          sha256sum "../dist/$ARTIFACT_NAME"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-TitoDex-${{ inputs.version }}-${{ matrix.variant }}-rg-arm64.apk
          path: dist/TitoDex-${{ inputs.version }}-${{ matrix.variant }}-rg-arm64.apk
          if-no-files-found: error
          retention-days: 14

  build-extension:
    name: Build unsigned Journey Assistant extension APK
    needs: [approve-source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.approve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Require secret-free checkout
        run: |
          test ! -e android/key.properties
          test ! -e android/titodex-upload.keystore

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"

      - name: Prepare Flutter Android project
        run: flutter pub get

      - name: Build unsigned extension APK
        env:
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
          HOST_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd android
          gradle \
            -PjourneyPackVersionName="$EXTENSION_VERSION" \
            -PjourneyPackVersionCode="$EXTENSION_BUILD_NUMBER" \
            -PjourneyPackMinHostVersion="$HOST_VERSION" \
            :journey-assistant-pack:check \
            :journey-assistant-pack:assembleJourneyAssistantPack
          apk="../build/journey-assistant-pack/outputs/apk/release/journey-assistant-pack-release.apk"
          test -s "$apk"
          mkdir -p ../../dist
          cp "$apk" "../../dist/TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"
          sha256sum "../../dist/TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"

      - name: Upload unsigned extension APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-TitoDex-Journey-Assistant-${{ inputs.extension_version }}-rg.apk
          path: dist/TitoDex-Journey-Assistant-${{ inputs.extension_version }}-rg.apk
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign approved build APK
    needs: [approve-source, validate, build, build-extension]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - TitoDex-${{ inputs.version }}-lite-rg-arm64.apk
          - TitoDex-${{ inputs.version }}-offline-rg-arm64.apk
          - TitoDex-Journey-Assistant-${{ inputs.extension_version }}-rg.apk
    steps:
      # No checkout, build cache, Gradle, Flutter, or repository scripts here.
      - name: Download exact unsigned artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Align, sign, and verify APK using SDK tools only
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$key"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          [[ "$EXPECTED_SIGNER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]
          test -f "unsigned/$ARTIFACT_NAME"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$tools/zipalign"
          test -x "$tools/apksigner"
          mkdir -p aligned dist
          "$tools/zipalign" -P 16 -f 4 "unsigned/$ARTIFACT_NAME" "aligned/$ARTIFACT_NAME"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          unset ANDROID_KEYSTORE_BASE64
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/$ARTIFACT_NAME" "aligned/$ARTIFACT_NAME"
          rm -f "$key"
          unset ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS
          certs="$("$tools/apksigner" verify --verbose --print-certs "dist/$ARTIFACT_NAME")"
          signer="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test "${signer,,}" = "${EXPECTED_SIGNER_SHA256,,}"
          "$tools/zipalign" -c -P 16 4 "dist/$ARTIFACT_NAME"
          sha256sum "dist/$ARTIFACT_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
