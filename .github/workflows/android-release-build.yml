name: Android Release APKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the leading v, for example 0.5.5
        required: true
        type: string
      lite_build_number:
        description: Monotonically increasing Android versionCode for Lite
        required: true
        type: string
      offline_build_number:
        description: Monotonically increasing Android versionCode for Offline
        required: true
        type: string
      extension_version:
        description: Journey Assistant extension versionName
        required: true
        default: 1.0.0
        type: string
      extension_build_number:
        description: Journey Assistant extension versionCode
        required: true
        default: "1"
        type: string
      bundle_manifest_url:
        description: Published root manifest used to seed the Offline APK
        required: true
        default: https://dex.tito.cafe/bundle-manifest.json
        type: string
      offline_seed_apk_url:
        description: Optional prior Offline APK whose verified embedded dex seed should be reused
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out selected release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$LITE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$OFFLINE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXTENSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$EXTENSION_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( OFFLINE_BUILD_NUMBER > LITE_BUILD_NUMBER ))

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build unsigned ${{ matrix.variant }} APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, offline]
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out selected release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Download and verify published offline dex seed
        if: matrix.variant == 'offline'
        env:
          BUNDLE_MANIFEST_URL: ${{ inputs.bundle_manifest_url }}
          OFFLINE_SEED_APK_URL: ${{ inputs.offline_seed_apk_url }}
        run: |
          set -euo pipefail
          mkdir -p assets/dex
          if [[ -n "$OFFLINE_SEED_APK_URL" ]]; then
            curl --fail --location --retry 5 --output /tmp/titodex-offline-seed.apk "$OFFLINE_SEED_APK_URL"
            unzip -p /tmp/titodex-offline-seed.apk \
              assets/flutter_assets/assets/dex/bundle-manifest.json \
              > assets/dex/bundle-manifest.json
            unzip -p /tmp/titodex-offline-seed.apk \
              assets/flutter_assets/assets/dex/bundle.tar.zst \
              > assets/dex/bundle.tar.zst
          else
            curl --fail --location --retry 5 --output assets/dex/bundle-manifest.json "$BUNDLE_MANIFEST_URL"
          fi
          archive_url="$(python3 -c 'import json; print(json.load(open("assets/dex/bundle-manifest.json"))["archiveUrl"])')"
          expected_sha="$(python3 -c 'import json; print(json.load(open("assets/dex/bundle-manifest.json"))["archiveSha256"])')"
          python3 - <<'PY'
          import json
          manifest = json.load(open("assets/dex/bundle-manifest.json", encoding="utf-8"))
          assert manifest["bundleVersion"] == 20, manifest
          assert manifest["pokemonCount"] == 1025, manifest
          assert manifest["complete"] is True, manifest
          assert manifest["cdnPrefix"] == "v5", manifest
          assert "/v5/" in manifest["archiveUrl"], manifest
          assert len(manifest["archiveSha256"]) == 64, manifest
          PY
          if [[ -z "$OFFLINE_SEED_APK_URL" ]]; then
            curl --fail --location --retry 5 --output assets/dex/bundle.tar.zst "$archive_url"
          fi
          test -s assets/dex/bundle.tar.zst
          test -s assets/dex/bundle-manifest.json
          actual_sha="$(sha256sum assets/dex/bundle.tar.zst | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          sed -i '\|    - assets/config/|a\    - assets/dex/' pubspec.yaml

      - name: Prepare production dependencies
        run: |
          set -euo pipefail
          # Flutter 3.44.x can generate a production registrant for root dev
          # plugins that Gradle correctly omits from the release classpath.
          # Keep integration_test for validation, but exclude it from the
          # ephemeral signed-build dependency graph.
          test "$(grep -c '^  integration_test:$' pubspec.yaml)" -eq 1
          sed -i '/^  integration_test:$/,+1d' pubspec.yaml
          flutter pub get
          ! grep -q '"name":"integration_test"' .flutter-plugins-dependencies

      - name: Configure package version
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
          LITE_BUILD_NUMBER: ${{ inputs.lite_build_number }}
          OFFLINE_BUILD_NUMBER: ${{ inputs.offline_build_number }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == "offline" ]]; then
            echo "BUILD_NAME=$VERSION-offline" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$OFFLINE_BUILD_NUMBER" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "BUILD_NUMBER=$LITE_BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "ARTIFACT_NAME=TitoDex-$VERSION-$VARIANT-rg-arm64.apk" >> "$GITHUB_ENV"

      - name: Build unsigned arm64 APK
        env:
          TITODEX_JOURNEY_ASSISTANT_URL: ${{ secrets.TITODEX_JOURNEY_ASSISTANT_URL }}
          TITODEX_EXTENSION_CATALOG_URL: ${{ secrets.TITODEX_EXTENSION_CATALOG_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          expected = {
              "TITODEX_JOURNEY_ASSISTANT_URL": "/v1/ask",
              "TITODEX_EXTENSION_CATALOG_URL": "/v1/extensions/journey_assistant/catalog",
          }
          origins = set()
          for name, path in expected.items():
              value = os.environ.get(name, "")
              parsed = urlparse(value)
              assert parsed.scheme == "https" and parsed.netloc, f"{name} is not configured"
              assert not parsed.username and not parsed.password
              assert parsed.path == path and not parsed.query and not parsed.fragment
              origins.add((parsed.scheme, parsed.netloc))
          assert len(origins) == 1, "Journey endpoints must share one Worker origin"
          PY
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define="TITODEX_JOURNEY_ASSISTANT_URL=$TITODEX_JOURNEY_ASSISTANT_URL" \
            --dart-define="TITODEX_EXTENSION_CATALOG_URL=$TITODEX_EXTENSION_CATALOG_URL"

      - name: Name and inspect unsigned APK
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/$ARTIFACT_NAME"
          if [[ "$VARIANT" == "offline" ]]; then
            ../tools/verify_release_apk.sh --offline --expected-bundle-version 20 \
              "../dist/$ARTIFACT_NAME"
          else
            ../tools/verify_release_apk.sh "../dist/$ARTIFACT_NAME"
          fi
          sha256sum "../dist/$ARTIFACT_NAME"

      - name: Upload inspected unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.variant }}
          path: dist/TitoDex-${{ inputs.version }}-${{ matrix.variant }}-rg-arm64.apk
          if-no-files-found: error
          retention-days: 14

  build-extension:
    name: Build unsigned Journey Assistant extension APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out selected release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.14"

      - name: Prepare Flutter Android project
        run: flutter pub get

      - name: Build unsigned extension APK
        env:
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          EXTENSION_BUILD_NUMBER: ${{ inputs.extension_build_number }}
          HOST_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd android
          gradle \
            -PjourneyPackVersionName="$EXTENSION_VERSION" \
            -PjourneyPackVersionCode="$EXTENSION_BUILD_NUMBER" \
            -PjourneyPackMinHostVersion="$HOST_VERSION" \
            :journey-assistant-pack:check \
            :journey-assistant-pack:assembleJourneyAssistantPack
          apk="../build/journey-assistant-pack/outputs/apk/release/journey-assistant-pack-release-unsigned.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          mkdir -p ../../dist
          cp "$apk" "../../dist/TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"
          sha256sum "../../dist/TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"

      - name: Upload inspected unsigned extension APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-extension
          path: dist/TitoDex-Journey-Assistant-${{ inputs.extension_version }}-rg.apk
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign and verify ${{ matrix.variant }} APK on a fresh runner
    needs: [build, build-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-signing
    strategy:
      matrix:
        variant: [lite, offline, extension]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-${{ matrix.variant }}
          path: unsigned
      - name: Verify and sign the promoted APK using runner Android tools
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ inputs.version }}
          EXTENSION_VERSION: ${{ inputs.extension_version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          if [[ "$VARIANT" = extension ]]; then
            name="TitoDex-Journey-Assistant-$EXTENSION_VERSION-rg.apk"
          else
            name="TitoDex-$VERSION-$VARIANT-rg-arm64.apk"
          fi
          test "$(find unsigned -type f | wc -l)" -eq 1
          test -s "unsigned/$name"
          unzip -t "unsigned/$name" >/dev/null
          mkdir -p dist
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "$build_tools/zipalign" -P 16 -f 4 "unsigned/$name" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/$name" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"
          unset ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS
          "$build_tools/zipalign" -c -P 16 4 "dist/$name"
          certs="$("$build_tools/apksigner" verify --verbose --print-certs "dist/$name")"
          printf '%s\n' "$certs"
          if [[ -n "$EXPECTED_SIGNER_SHA256" ]]; then
            actual="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
            test "${actual,,}" = "${EXPECTED_SIGNER_SHA256,,}"
          fi
          if [[ "$VARIANT" = offline ]]; then
            tools/verify_release_apk.sh --offline --expected-bundle-version 20 "dist/$name"
          elif [[ "$VARIANT" = lite ]]; then
            tools/verify_release_apk.sh "dist/$name"
          fi
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
