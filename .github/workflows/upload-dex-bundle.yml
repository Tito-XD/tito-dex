name: Patch and Publish Dex Bundle v19
# Current live bundle publish workflow (2026-08-08).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified /v5 objects and switch the root manifest last (false = build + verify only)
        required: true
        default: false
        type: boolean
      expected_production_version:
        description: Live bundleVersion that must still be production before v19 publish
        required: true
        default: 18
        type: number

permissions:
  contents: read

concurrency:
  group: dex-bundle-v19-production
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out selected release ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/dex_bundle_requirements.txt

      - name: Download and verify live v18 base
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          set -euo pipefail
          mkdir -p dist/dex-v18/staging dist/dex-v18/upload dist/rollback
          curl --fail --location --retry 5 --output dist/live-manifest.json https://dex.tito.cafe/bundle-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/live-manifest.json").read_text(encoding="utf-8"))
          expected = int(os.environ["EXPECTED_VERSION"])
          assert manifest["bundleVersion"] == expected, (manifest["bundleVersion"], expected)
          assert manifest["cdnPrefix"] == "v5" and manifest["complete"] is True, manifest
          Path("dist/archive-url.txt").write_text(manifest["archiveUrl"], encoding="utf-8")
          print(f"production pre-check ok: bundleVersion={expected}")
          PY
          curl --fail --location --retry 5 --output dist/dex-v18.tar.zst "$(cat dist/archive-url.txt)"
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          import zstandard
          archive = Path("dist/dex-v18.tar.zst")
          manifest = json.loads(Path("dist/live-manifest.json").read_text(encoding="utf-8"))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["archiveSha256"]
          with archive.open("rb") as source:
              with zstandard.ZstdDecompressor().stream_reader(source) as stream:
                  with tarfile.open(fileobj=stream, mode="r|") as bundle:
                      bundle.extractall("dist/dex-v18/staging", filter="data")
          Path("dist/dex-v18/upload/bundle-manifest.json").write_bytes(
              Path("dist/live-manifest.json").read_bytes()
          )
          PY

      - name: Preserve v18 root manifest for rollback
        if: inputs.publish
        run: cp dist/live-manifest.json dist/rollback/bundle-manifest-v18.json

      - name: Upload rollback manifest backup
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: titodex-root-manifest-v18-rollback
          path: dist/rollback/bundle-manifest-v18.json
          if-no-files-found: error
          retention-days: 30

      - name: Run v19 data tests
        run: |
          python3 tools/test_enrich_items_v19.py
          python3 tools/test_sprite_version_existence.py
          python3 tools/test_audit_form_media.py
          python3 tools/test_fill_shared_item_icons_v19.py
          python3 tools/test_audit_item_media_v19.py
          python3 tools/test_stage_dex_incremental_upload.py

      - name: Patch v18 into Dex bundle v19
        run: |
          python3 tools/patch_dex_bundle_v19_items.py
          python3 tools/audit_item_media_v19.py
          python3 tools/patch_dex_bundle_v19_items.py

      - name: Verify complete v19 candidate
        run: |
          python3 tools/verify_dex_upload_tree.py dist/dex-v19/upload
          python3 tools/verify_dex_v19_items.py dist/dex-v19/staging

      - name: Stage only changed v19 objects
        run: >-
          python3 tools/stage_dex_incremental_upload.py dist/dex-v19/upload
          --base-v5 dist/dex-v18/staging
          --output dist/dex-v19-incremental

      - name: Upload verified full bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v19
          path: dist/dex-v19/upload
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Wrangler fallback
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Install Wrangler fallback
        if: inputs.publish
        working-directory: cloudflare/dex-cdn
        run: npm ci

      - name: Upload and verify changed /v5 objects
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v19-incremental
          --cdn-prefix v5 --phase objects --workers 16

      - name: Atomically switch the root manifest
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v19-incremental
          --cdn-prefix v5 --phase manifest

      - name: Verify public v19 cutover
        if: inputs.publish
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error https://dex.tito.cafe/bundle-manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["bundleVersion"] == 19 and m["cdnPrefix"] == "v5" and m["itemDescriptionCoverage"] == 2130 and m["itemSpriteCount"] == 2130 and m["archiveUrl"].endswith("/bundle-v19.tar.zst"), m'; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/v5/items.json?v=19' | python3 -c 'import json,sys; items=json.load(sys.stdin); assert len(items) == 2130; assert sum(bool(x.get("descriptionZh") or x.get("effectZh")) for x in items.values()) == 2130'
          curl --fail --retry 8 --retry-delay 5 --output /tmp/bicycle-v19.png 'https://dex.tito.cafe/v5/item-sprites/bicycle.png?v=19'
          cmp /tmp/bicycle-v19.png dist/dex-v19/upload/v5/item-sprites/bicycle.png
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/cdn-health?probe=1' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True, h'
          curl --fail --retry 8 --retry-delay 5 -I https://dex.tito.cafe/v5/bundle-v19.tar.zst | head -n 1
