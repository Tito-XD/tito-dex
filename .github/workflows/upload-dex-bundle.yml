name: Patch and Publish Dex Bundle v18
# Current live bundle publish workflow (2026-08-07).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified /v5 objects and switch the root manifest last (false = build + verify only)
        required: true
        default: false
        type: boolean
      expected_production_version:
        description: Live bundleVersion that must still be production before v18 publish (17 until v18 goes live)
        required: true
        default: 17
        type: number
      reuse_run_id:
        description: Reuse a preserved v17 diagnostic artifact from this workflow run
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dex-bundle-v17-production
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    # v18 pulls the live v17 archive and adds the 52poke online media catalog
    # (cries + forme art) as an id-keyed reference file. No PokeAPI.
    timeout-minutes: 120
    steps:
      - name: Check out selected release ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/dex_bundle_requirements.txt

      - name: Production version pre-check
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          mkdir -p dist/rollback
          curl --fail --location --retry 5 --output dist/live-manifest.json https://dex.tito.cafe/bundle-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path("dist/live-manifest.json").read_text(encoding="utf-8"))
          expected = int(os.environ["EXPECTED_VERSION"])
          assert m["bundleVersion"] == expected, (m["bundleVersion"], expected)
          assert m["cdnPrefix"] == "v5", m
          assert m["complete"] is True, m
          print(f"production pre-check ok: bundleVersion={m['bundleVersion']} cdnPrefix={m['cdnPrefix']}")
          PY

      - name: Preserve the current v17 root manifest for rollback
        if: inputs.publish
        env:
          EXPECTED_VERSION: ${{ inputs.expected_production_version }}
        run: |
          cp dist/live-manifest.json dist/rollback/bundle-manifest-v17.json
          python3 - <<'PY'
          import json, os
          m = json.load(open("dist/rollback/bundle-manifest-v17.json", encoding="utf-8"))
          assert m["bundleVersion"] == int(os.environ["EXPECTED_VERSION"]) and m["cdnPrefix"] == "v5", m
          PY

      - name: Upload rollback manifest backup
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: titodex-root-manifest-v17-rollback
          path: dist/rollback/bundle-manifest-v17.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate media catalog reference file
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("data/l10n/zh/media_catalog_52poke.json").read_text(encoding="utf-8"))
          assert len(catalog) >= 1000, len(catalog)
          assert "25" in catalog and catalog["25"]["nameZh"] == "皮卡丘", catalog.get("25")
          print(f"ok: media catalog {len(catalog)} entries")
          PY

      - name: Restore preserved v17 bundle
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: titodex-dex-v18-diagnostic-${{ inputs.reuse_run_id }}
          path: dist/dex-v18/upload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id }}

      - name: Patch v17 into Dex bundle v18
        if: inputs.reuse_run_id == ''
        run: >-
          python3 tools/patch_dex_bundle_v18_media_catalog.py
          --output dist/dex-v18

      - name: Verify upload tree
        run: python3 tools/verify_dex_upload_tree.py dist/dex-v17/upload

      - name: Spot-check media catalog in bundle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path("dist/dex-v18/upload/bundle-manifest.json").read_text(encoding="utf-8"))
          assert root["bundleVersion"] == 18 and root["cdnPrefix"] == "v5", root
          assert root.get("mediaCatalogEntries", 0) >= 1000, root
          catalog = json.loads(Path("dist/dex-v18/upload/v5/media_catalog_52poke.json").read_text(encoding="utf-8"))
          assert "25" in catalog and len(catalog["25"]["cries"]) >= 3, catalog.get("25")
          print(f"ok: media catalog {len(catalog)} entries bundled")
          PY

      - name: Preserve generated bundle when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v18-diagnostic-${{ github.run_id }}
          path: dist/dex-v18/upload
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v18
          path: dist/dex-v18/upload
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Wrangler
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Install Wrangler
        if: inputs.publish
        working-directory: cloudflare/dex-cdn
        run: npm ci

      - name: Upload and verify immutable /v5 objects
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v18/upload
          --cdn-prefix v5 --phase objects

      - name: Atomically switch the root manifest
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v18/upload
          --cdn-prefix v5 --phase manifest

      - name: Verify public v18 cutover
        if: inputs.publish
        run: |
          curl --fail --retry 8 --retry-delay 5 https://dex.tito.cafe/bundle-manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["bundleVersion"] == 18 and m["cdnPrefix"] == "v5" and m.get("mediaCatalogEntries", 0) >= 1000 and m["archiveUrl"].endswith("/bundle-v18.tar.zst"), m'
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/cdn-health?probe=1' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True, h'
          curl --fail --retry 8 --retry-delay 5 -I https://dex.tito.cafe/v5/bundle-v18.tar.zst | head -n 1
