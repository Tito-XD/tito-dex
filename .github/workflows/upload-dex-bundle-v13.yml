name: Patch and Publish Dex Bundle v13

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified /v5 objects and switch the root manifest last
        required: true
        default: true
        type: boolean
      reuse_run_id:
        description: Reuse a preserved v13 diagnostic artifact from this workflow run
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dex-bundle-v13-production
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    # Incremental over live v12: extract → write form chains → zstd. No PokeAPI.
    timeout-minutes: 60
    steps:
      - name: Check out selected release ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dex_bundle_requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/dex_bundle_requirements.txt

      - name: Preserve the current v12 root manifest for rollback
        if: inputs.publish
        run: |
          mkdir -p dist/rollback
          curl --fail --location --retry 5 --output dist/rollback/bundle-manifest-v12.json https://dex.tito.cafe/bundle-manifest.json
          python3 -c 'import json; m=json.load(open("dist/rollback/bundle-manifest-v12.json")); assert m["bundleVersion"] == 12 and m["cdnPrefix"] == "v5", m'

      - name: Upload rollback manifest backup
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: titodex-root-manifest-v12-rollback
          path: dist/rollback/bundle-manifest-v12.json
          if-no-files-found: error
          retention-days: 30

      - name: Run form-evolution unit tests
        run: |
          python3 tools/test_form_evolution_targets.py

      - name: Restore preserved v13 bundle
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: titodex-dex-v13-diagnostic-${{ inputs.reuse_run_id }}
          path: dist/dex-v13/upload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id }}

      # v13 pulls the live v12 archive (~102 MB) and only rewrites
      # forms[].evolutionChain — no PokeAPI, no sprite rebuild.
      - name: Patch v12 into Dex bundle v13
        if: inputs.reuse_run_id == ''
        run: >-
          python3 tools/patch_dex_bundle_v13_form_evolution.py
          --output dist/dex-v13

      - name: Verify upload tree
        run: python3 tools/verify_dex_upload_tree.py dist/dex-v13/upload

      - name: Spot-check Hisuian Growlithe chain
        if: inputs.reuse_run_id == ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          detail = json.loads(Path("dist/dex-v13/upload/v5/details/58.json").read_text())
          by_key = {form["key"]: form for form in detail["forms"]}
          hisui = by_key["growlithe-hisui"]["evolutionChain"]
          child = hisui["children"][0]
          assert hisui["formKey"] == "growlithe-hisui", hisui
          assert child["formKey"] == "arcanine-hisui", child
          assert "洗翠" in child["nameZh"], child
          assert child["localSpritePath"].startswith("sprites/forms/"), child
          print("ok:", hisui["nameZh"], "→", child["nameZh"], child["localSpritePath"])
          PY

      - name: Preserve generated bundle when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v13-diagnostic-${{ github.run_id }}
          path: dist/dex-v13/upload
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: titodex-dex-v13
          path: dist/dex-v13/upload
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Wrangler
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/dex-cdn/package-lock.json

      - name: Install Wrangler
        if: inputs.publish
        working-directory: cloudflare/dex-cdn
        run: npm ci

      - name: Upload and verify immutable /v5 objects
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v13/upload
          --cdn-prefix v5 --phase objects

      - name: Atomically switch the root manifest
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python3 tools/upload_dex_bundle_r2.py dist/dex-v13/upload
          --cdn-prefix v5 --phase manifest

      - name: Verify public v13 cutover
        if: inputs.publish
        run: |
          curl --fail --retry 8 --retry-delay 5 https://dex.tito.cafe/bundle-manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["bundleVersion"] == 13 and m["cdnPrefix"] == "v5", m'
          curl --fail --retry 8 --retry-delay 5 'https://dex.tito.cafe/cdn-health?probe=1' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True, h'
          curl --fail --retry 8 --retry-delay 5 https://dex.tito.cafe/v5/details/58.json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          by={f["key"]:f for f in d["forms"]}
          child=by["growlithe-hisui"]["evolutionChain"]["children"][0]
          assert child["formKey"]=="arcanine-hisui" and "洗翠" in child["nameZh"], child
          print("live ok:", child["nameZh"])
          '
