name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - flutter/**
      - data/l10n/zh/dex_axes.json
      - tools/generate_dex_axis_labels.py
      - tools/test_generate_dex_axis_labels.py
      - .github/workflows/flutter-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - flutter/**
      - data/l10n/zh/dex_axes.json
      - tools/generate_dex_axis_labels.py
      - tools/test_generate_dex_axis_labels.py
      - .github/workflows/flutter-ci.yml

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Keep errors fatal while the repository's known warning/info baseline
        # is cleaned up separately.
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Verify generated dex-axis labels
        run: cd .. && python3 tools/test_generate_dex_axis_labels.py

      - name: Run tests
        run: flutter test --no-pub

      - name: Build web release
        run: flutter build web --release --no-pub

  android-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true
          pub-cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Run Android integration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: flutter
          script: flutter test integration_test/media_verify_test.dart -d emulator-5554
